{% extends 'base.html' %}
{% load static %}

{% block content %}
<h2>Compile Output</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% else %}
        <ul>
            {% for url in output_urls %}
                <li><a href="{{ url }}" download>{{ url|cut:"/media/" }}</a></li>
            {% endfor %}
        </ul>
    {% endif %}
    <a href="{{request.META.HTTP_REFERER}}">Back to Upload</a>

{% endblock content %}

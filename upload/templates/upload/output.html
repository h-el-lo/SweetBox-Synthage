<!DOCTYPE html>
<html>
<head>
    <title>Compile Result</title>
</head>
<body>
    <h2>Compile Output</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% else %}
        <ul>
            {% for url in output_urls %}
                <li><a href="{{ url }}" download>{{ url|cut:"/media/" }}</a></li>
            {% endfor %}
        </ul>
    {% endif %}
    <a href="{% url 'upload' %}">Back to Upload</a>
</body>
</html>

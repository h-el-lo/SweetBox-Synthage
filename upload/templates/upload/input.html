<!DOCTYPE html>
<html>
<head>
    <title>Upload Arduino Sketch</title>
</head>
<body>
    <h2>Upload Arduino Sketch (.ino)</h2>
    <form method="post" enctype="multipart/form-data" action="{% url 'upload2' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Compile Sketch</button>
    </form>
</body>
</html>
